{% extends "base.html" %}

{% block title %}
    Login — UniversalShop
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <span class="section-label">
                WELCOME BACK
            </span>

            <h1>
                Sign in
            </h1>

            <p>
                Access your UniversalShop account.
            </p>

        </div>


        <form method="post" class="auth-form">

            {% csrf_token %}

            <div class="form-field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="button button-primary auth-button"
            >
                Sign In →
            </button>

        </form>


        <div class="auth-footer">

            <span>
                Don't have an account?
            </span>

            <a href="{% url 'register' %}">
                Create one
            </a>

        </div>

    </div>

</section>

{% endblock %}
